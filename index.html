<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income vs Housing vs CPI Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .chart-container { display: flex; flex-direction: column; gap: 20px; }
    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
    .region-checkboxes label { display: block; margin-right: 10px; }
    .chart { width: 100%; height: 400px; }
    .tooltip { position: absolute; padding: 5px 10px; background: #fff; border: 1px solid #ccc; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Economic Trends Dashboard</h1>

  <div class="filters">
    <div class="controls">
      <label><input type="checkbox" id="adjustInflation"> Adjust for Inflation</label>
      <label><input type="checkbox" id="showRecessions" checked> Show Recessions</label>
    </div>

    <div class="date-filters">
      <label>Start Date: <input type="date" id="startDate" value="1975-01-01"></label>
      <label>End Date: <input type="date" id="endDate" value="2023-01-01"></label>
      <select id="presetRange" style="min-width: 200px;">
        <option value="">-- Select Time Period --</option>
        <option value="all-time">All Time (1975-2023)</option>
        <optgroup label="Recessions">
          <option value="1973-1975">1973-1975 Recession (1965-1985)</option>
          <option value="1980">1980 Recession (1970-1990)</option>
          <option value="1981-1982">1981-1982 Recession (1971-1992)</option>
          <option value="1990-1991">1990-1991 Recession (1980-2000)</option>
          <option value="2001">2001 Dot-com Recession (1991-2011)</option>
          <option value="2008">Great Recession (1998-2018)</option>
          <option value="2020">COVID-19 Recession (2010-2023)</option>
        </optgroup>
        <optgroup label="Decades">
          <option value="1970s">1970s (1970-1980)</option>
          <option value="1980s">1980s (1980-1990)</option>
          <option value="1990s">1990s (1990-2000)</option>
          <option value="2000s">2000s (2000-2010)</option>
          <option value="2010s">2010s (2010-2020)</option>
        </optgroup>
      </select>
    </div>
  </div>

  <div class="chart-grid">
    <div id="incomeHousingChart" class="chart"></div>
    <div id="personalIncomeChart" class="chart"></div>
    <div id="familyIncomeChart" class="chart"></div>
    <div id="housingChart" class="chart"></div>
  </div>

  <script src="script.js"></script>
</body>

</html>
